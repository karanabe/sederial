[package]
name = "sederial"
version = "0.1.0"
edition = "2024"
rust-version = "1.98.1"
description = "A lightweight DNS forwarder for split-DNS environments"
license = "MIT OR Apache-2.0"
repository = "https://github.com/karanabe/sederial"
include = [
    "/src/**",
    "/tests/*.rs",
    "/tests/support/**",
    "/packaging/sederial.toml",
    "/LICENSE-APACHE",
    "/LICENSE-MIT",
    "/README.md",
]

[dependencies]
toml = { version = "1.1", default-features = false, features = ["parse", "std"] }
signal-hook = { version = "0.4", default-features = false }

[lints.rust]
unsafe_code = "forbid"

[profile.release]
lto = "thin"
strip = true
