name: Release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          persist-credentials: false
      - name: Validate tag
        if: github.event_name == 'push'
        env:
          TAG: ${{ github.ref_name }}
        run: |
          [[ "$TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]
          version=$(sed -n 's/^version = "\([^"]*\)"$/\1/p' Cargo.toml)
          test "$TAG" = "v$version"
      - run: rustup show
      - run: cargo fmt --all -- --check
      - run: cargo check --locked
      - run: cargo test --locked
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: python3 scripts/check-dependencies.py --target "${{ matrix.target }}"
      - name: Verify published crate contents
        env:
          TARGET: ${{ matrix.target }}
        run: |
          cargo package --locked
          version=$(sed -n 's/^version = "\([^"]*\)"$/\1/p' Cargo.toml)
          python3 scripts/verify-crate.py "target/package/sederial-$version.crate" --target "$TARGET"
      - name: Build and package
        env:
          TARGET: ${{ matrix.target }}
        run: |
          version=$(sed -n 's/^version = "\([^"]*\)"$/\1/p' Cargo.toml)
          cargo build --release --locked --target "$TARGET"
          scripts/package.sh "$version" "$TARGET" "target/$TARGET/release/sederial"
          python3 scripts/verify-artifacts.py "$version" "$TARGET" --native
          python3 tests/standalone_smoke.py "target/$TARGET/release/sederial"
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: release-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error
  publish:
    needs: build
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          pattern: release-*
          path: dist
          merge-multiple: true
      - name: Publish verified artifacts
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          version=${TAG#v}
          cd dist
          artifacts=(sederial-x86_64-unknown-linux-gnu.tar.gz sederial-aarch64-unknown-linux-gnu.tar.gz
                     "sederial_${version}_amd64.deb" "sederial_${version}_arm64.deb")
          for artifact in "${artifacts[@]}"; do test -s "$artifact"; done
          sha256sum "${artifacts[@]}" > SHA256SUMS
          gh release create "$TAG" --verify-tag --draft --title "Sederial $TAG" --generate-notes
          gh release upload "$TAG" "${artifacts[@]}" SHA256SUMS
          gh release edit "$TAG" --draft=false
